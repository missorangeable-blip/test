<!DOCTYPE html>
<html>
<head>
    <title>Todoアプリ</title>
</head>
<body>

    <h1>Todoアプリ</h1>

    <form method="POST">  
        <!--入力欄とボタンはセット-->

    <input
        type="text"
        name="task"
        placeholder="タスクを入力"
    >

    <button type="submit">
        追加
    </button>

    </form>

    <ul>

        {% for task in tasks %}
            <li>{{ task }}</li>  
            <!--変数taskの中身を表示-->
        {% endfor %}
        
    </ul>
    
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Todoアプリ</title>
</head>
<body>

    <h1>Todoアプリ</h1>

    <form method="POST">  
        <!--入力欄とボタンはセット-->

    <input
        type="text"
        name="task"
        placeholder="タスクを入力"
    >

    <button type="submit">
        追加
    </button>

    </form>

    <ul>

        {% for task in tasks %}

        <li>

            <a href="/toggle/{{ loop.index0 }}">

                {% if task["done"] %}

                    ☑

                {% else %}

                    ☐
                
                {% endif %}

            </a>
            
            {{ task["task"] }}
        
            <a href="/delete/{{ loop.index0 }}">

                削除

            </a>
        </li>  
            <!--変数taskの中身を表示-->
        {% endfor %}
        
    </ul>
    
</body>
</html>

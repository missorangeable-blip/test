<!DOCTYPE html>
<html>
<head>
    <title>Todoアプリ</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static',
        filename='style.css') }}"
        >
</head>
<body>

    <h1>Todoアプリ</h1>

    <form method="POST">  
        <!--入力欄とボタンはセット-->

    <input
        type="text"
        name="task"
        placeholder="タスクを入力"
    >

    <input
        type="date"
        name="deadline"
    >

    <button type="submit">
        追加
    </button>

    </form>

    <ul>

        {% for task in tasks %}

        <li>

            <div class="task-info">

                <a href="/toggle/{{ loop.index0 }}">

                    {% if task["done"] %}

                        ☑

                    {% else %}

                        ☐
                
                    {% endif %}

                </a>
            </div>

            <div class="task-text">

                {% if task["done"] %}

                    <span class="completed">
                        {{ task["task"] }}
                    </span>

                {% else %}
            
                    <span>
                        {{ task["task"] }}
                    </span>

                {% endif %}

                <div class="deadline">
                    期限: {{ task["deadline"] }}
                </div>

            </div>
        
            <a
                class="delete-link"
                href="/delete/{{ loop.index0 }}"
            >

                削除

            </a>
        </li>  
            <!--変数taskの中身を表示-->
        {% endfor %}
        
    </ul>
    
</body>
</html>

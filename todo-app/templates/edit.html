<!DOCTYPE html>
<html>

<head>
    <title>編集</title>
</head>

<body>

<h1>タスク編集</h1>

<form method="POST">

    <input
        type="text"
        name="task"
        value="{{ task['task'] }}"
    >

    <input
        type="date"
        name="deadline"
        value="{{ task['deadline'] }}"
    >

    <select name="priority">

        <option
            value="high"
            {% if task["priority"] == "high" %}
            selected
            {% endif %}
        >
            高
        </option>

        <option
            value="medium"
            {% if task["priority"] == "medium" %}
            selected
            {% endif %}
        >
            中
        </option>

        <option
            value="low"
            {% if task["priority"] == "low" %}
            selected
            {% endif %}
        >
            低
        </option>

    </select>

    <button type="submit">
        保存
    </button>

</form>

</body>
</html>
